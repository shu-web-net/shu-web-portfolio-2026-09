<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>

  <!-- category -->
  <text x="80" y="120" fill="#94a3b8" font-size="26" letter-spacing="4">制作実績</text>

  <!-- NDA badge (大きめ・塗り・鍵アイコン / バッジ中心 y=186 に上下中央揃え) -->
  <g>
    <rect x="80" y="146" width="470" height="80" rx="40" fill="#38bdf8"/>
    <g transform="translate(114,164)" fill="#0f172a">
      <path d="M7 22 v-7 a10 10 0 0 1 20 0 v7" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
      <rect x="2" y="22" width="30" height="20" rx="4"/>
    </g>
    <text x="166" y="186" fill="#0f172a" font-size="40" font-weight="700" dominant-baseline="central">非公開案件（NDA）</text>
  </g>

  <!-- title -->
  <text x="80" y="360" fill="#f1f5f9" font-size="76" font-weight="700">保育園グループサイト</text>
  <text x="80" y="452" fill="#cbd5e1" font-size="48" font-weight="500">全70園規模 ／ 各園を動的生成・検索・地図連携</text>

  <!-- tech chips -->
  <g font-size="28" font-weight="600">
    <g>
      <rect x="80" y="600" width="150" height="56" rx="12" fill="#334155"/>
      <text x="155" y="637" fill="#e2e8f0" text-anchor="middle">Next.js</text>
    </g>
    <g>
      <rect x="248" y="600" width="196" height="56" rx="12" fill="#334155"/>
      <text x="346" y="637" fill="#e2e8f0" text-anchor="middle">TypeScript</text>
    </g>
    <g>
      <rect x="462" y="600" width="220" height="56" rx="12" fill="#334155"/>
      <text x="572" y="637" fill="#e2e8f0" text-anchor="middle">Tailwind CSS</text>
    </g>
    <g>
      <rect x="700" y="600" width="176" height="56" rx="12" fill="#334155"/>
      <text x="788" y="637" fill="#e2e8f0" text-anchor="middle">microCMS</text>
    </g>
  </g>
</svg>
