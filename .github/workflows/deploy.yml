name: Build & Deploy to Xserver

on:
  push:
    branches: [main]
  workflow_dispatch: # Actionsタブから手動実行
  repository_dispatch: # microCMS Webhook から起動（工程⑤後半で連携）
    types: [microcms-publish]

# デプロイの多重起動を防ぐ（新しいpushが来たら古いジョブはキャンセル）
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # microCMSから記事・実績を取得して静的書き出し（out/ を生成）
      - name: Build (static export)
        run: npm run build
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_SERVICE_ID }}
          NEXT_PUBLIC_EMAILJS_TEMPLATE_ID_NOTIFY: ${{ secrets.NEXT_PUBLIC_EMAILJS_TEMPLATE_ID_NOTIFY }}
          NEXT_PUBLIC_EMAILJS_TEMPLATE_ID_AUTOREPLY: ${{ secrets.NEXT_PUBLIC_EMAILJS_TEMPLATE_ID_AUTOREPLY }}
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_EMAILJS_PUBLIC_KEY }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}

      # .htaccess を out/ 直下へ配置（Xserverルートに一緒にアップされる）
      - name: Place .htaccess into out/
        run: cp deploy/.htaccess out/.htaccess

      # FTPSでXserverへアップロード。
      # dangerous-clean-slate は使わない → サーバ既存の wp-content/uploads・
      # サブディレクトリサイトを消さない（差分アップのみ）。
      #
      # XserverのFTP制御コネクションが時々応答遅延し "Timeout (control socket)" で
      # 失敗することがあるため、timeoutを既定30秒から延長し、失敗時は間隔を置いて1回だけ自動リトライする。
      - name: Deploy to Xserver (FTPS)
        id: ftp_deploy
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          timeout: 120000

      - name: Wait before retry
        if: steps.ftp_deploy.outcome == 'failure'
        run: sleep 30

      - name: Deploy to Xserver (FTPS) - retry
        id: ftp_deploy_retry
        if: steps.ftp_deploy.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          timeout: 120000

      - name: Fail job if both attempts failed
        if: steps.ftp_deploy.outcome == 'failure' && steps.ftp_deploy_retry.outcome == 'failure'
        run: exit 1
