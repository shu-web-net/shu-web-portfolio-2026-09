name: Build & Deploy to Xserver

on:
  push:
    branches: [main]
  workflow_dispatch: # Actionsタブから手動実行
  repository_dispatch: # microCMS Webhook から起動（工程⑤後半で連携）
    types: [microcms-publish]

# デプロイの多重起動を防ぐ（新しいpushが来たら古いジョブはキャンセル）
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # microCMSから記事・実績を取得して静的書き出し（out/ を生成）
      - name: Build (static export)
        run: npm run build
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_SERVICE_ID }}
          NEXT_PUBLIC_EMAILJS_TEMPLATE_ID_NOTIFY: ${{ secrets.NEXT_PUBLIC_EMAILJS_TEMPLATE_ID_NOTIFY }}
          NEXT_PUBLIC_EMAILJS_TEMPLATE_ID_AUTOREPLY: ${{ secrets.NEXT_PUBLIC_EMAILJS_TEMPLATE_ID_AUTOREPLY }}
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_EMAILJS_PUBLIC_KEY }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}

      # .htaccess を out/ 直下へ配置（Xserverルートに一緒にアップされる）
      - name: Place .htaccess into out/
        run: cp deploy/.htaccess out/.htaccess

      # SSH鍵をエージェントに登録し、既知のホストとしてXserverを信頼する
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.XSERVER_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.XSERVER_SSH_PORT }} ${{ secrets.XSERVER_SSH_HOST }} >> ~/.ssh/known_hosts

      # SSH+rsyncでXserverへアップロード。
      # --delete は使わない → サーバ既存の wp-content/uploads・サブディレクトリサイトを消さない（差分アップのみ）。
      # 差分転送のため、FTPSより高速かつXserverのFTP制御コネクション遅延の影響を受けにくいが、
      # SSH接続も一時的な瞬断は起こり得るため、FTPS時代と同様に1回だけ自動リトライする。
      - name: Deploy to Xserver (SSH/rsync)
        run: |
          attempt=1
          max_attempts=2
          until timeout 300 rsync -avz --checksum \
              -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.XSERVER_SSH_PORT }} -o StrictHostKeyChecking=yes -o ConnectTimeout=30" \
              ./out/ ${{ secrets.XSERVER_SSH_USER }}@${{ secrets.XSERVER_SSH_HOST }}:${{ secrets.XSERVER_SSH_REMOTE_DIR }}; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "rsync failed after $attempt attempts."
              exit 1
            fi
            echo "rsync failed (attempt $attempt/$max_attempts). Retrying in 30s..."
            attempt=$((attempt + 1))
            sleep 30
          done
